name: Agentic Feature Workflow

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  plan-and-route:
    if: github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Call orchestrator via Vercel AI Gateway
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .agent/scripts/plan.mjs > plan.json

      - name: Post task plan as issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync("plan.json", "utf8");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Orchestrator plan\n\n```json\n" + plan + "\n```",
            });

      - name: Ensure and apply routed label
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = "agent:routed";
            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            if (!labels.some((label) => label.name === labelName)) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: "0E8A16",
                  description: "Issue has been routed by the orchestration workflow",
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labelName],
            });

      - name: Request GitHub Copilot coding agent
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ["copilot"],
              });
            } catch (error) {
              core.warning(`Copilot assignment skipped: ${error.status ?? "unknown error"}`);
            }
