name: Build and validate

on:
  push:
    branches:
      - main
      - feature/agentic-orchestration-scaffold
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run validation tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint
