name: Regen package-lock

on:
  workflow_dispatch:
  push:
    branches:
      - feat/governance-multi-agent-verification
    paths:
      - .github/workflows/regen-lock.yml

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/governance-multi-agent-verification
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only
      - name: Verify no @vercel/analytics
        run: |
          if grep -q '@vercel/analytics' package-lock.json; then
            echo 'ERROR: @vercel/analytics still present' >&2
            exit 1
          fi
          echo 'OK: analytics absent from lock'
      - name: Commit and push lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes'
            exit 0
          fi
          git commit -m 'chore(deps): drop residual @vercel/analytics from package-lock (ABC C)'
          git push origin HEAD:feat/governance-multi-agent-verification
