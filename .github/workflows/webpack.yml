name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - copilot/**
  pull_request:
    branches:
      - main
      - feature/**
      - copilot/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Lint application
        run: npm run lint
