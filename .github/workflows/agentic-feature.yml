name: Agentic Feature Workflow

on:
  issues:
    types: [labeled]

jobs:
  plan-and-route:
    if: github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Call orchestrator via Vercel AI Gateway
        id: plan
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          node .agent/scripts/plan.mjs > plan.json

      - name: Post task plan as issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.json', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Orchestrator plan\n\n```json\n" + plan + "\n```"
            });

      - name: Label subtasks for specialist agents
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["agent:routed"]
            });

      - name: Request GitHub Copilot coding agent
        run: gh issue edit ${{ github.event.issue.number }} --add-assignee "copilot"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Requires: AI_GATEWAY_API_KEY secret (Vercel AI Gateway), and .agent/scripts/plan.mjs
# implementing the Gateway call to grok-4.3 per .agent/ROUTING.md.
# This is a starting template — adjust the Copilot assignment step to match your
# organization's GitHub Copilot coding agent configuration.
